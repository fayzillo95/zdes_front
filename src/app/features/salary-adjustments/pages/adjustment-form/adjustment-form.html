<h2>{{ isEdit ? 'Edit' : 'New' }} Salary Adjustment</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
  <div class="form-group">
    <label for="employeeId">Employee ID</label>
    <input id="employeeId" type="number" formControlName="employeeId">
  </div>
  
  <div class="form-group">
    <label for="amount">Amount</label>
    <input id="amount" type="number" formControlName="amount">
  </div>
  
  <div class="form-group">
    <label for="type">Type</label>
    <select id="type" formControlName="type">
      <option value="bonus">Bonus</option>
      <option value="penalty">Penalty</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="reason">Reason</label>
    <input id="reason" type="text" formControlName="reason">
  </div>
  
  <div class="form-group">
    <label for="date">Date</label>
    <input id="date" type="date" formControlName="date">
  </div>
  
  <div class="actions">
    <button type="submit" [disabled]="form.invalid">Save</button>
    <button type="button" routerLink="/salary-adjustments">Cancel</button>
  </div>
</form>
