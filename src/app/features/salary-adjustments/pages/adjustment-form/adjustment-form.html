<div class="form-page">
  <div class="form-card">
    <div class="form-header">
      <div class="form-header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 8v8"></path>
          <path d="M8 12h8"></path>
        </svg>
      </div>
      <div>
        <h2 class="form-title">{{ isEdit ? 'Edit' : 'New' }} Salary Adjustment</h2>
        <p class="form-subtitle">Ish haqi o'zgarishi ma'lumotlarini kiriting</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-body">
      <div class="form-group">
        <label for="employeeId" class="form-label">Employee ID</label>
        <input id="employeeId" type="number" formControlName="employeeId" class="form-input">
      </div>
      
      <div class="form-group">
        <label for="amount" class="form-label">Amount</label>
        <input id="amount" type="number" formControlName="amount" class="form-input">
      </div>
      
      <div class="form-group">
        <label for="type" class="form-label">Type</label>
        <select id="type" formControlName="type" class="form-select">
          <option value="bonus">Bonus</option>
          <option value="penalty">Penalty</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="reason" class="form-label">Reason</label>
        <input id="reason" type="text" formControlName="reason" class="form-input">
      </div>
      
      <div class="form-group">
        <label for="date" class="form-label">Date</label>
        <input id="date" type="date" formControlName="date" class="form-input">
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-gradient-submit" [disabled]="form.invalid">Save</button>
        <button type="button" class="btn btn-secondary-cancel" routerLink="/salary-adjustments">Cancel</button>
      </div>
    </form>
  </div>
</div>
