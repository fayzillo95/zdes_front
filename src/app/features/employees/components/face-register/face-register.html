<div class="face-register-container">
  <h3>Yuzni ro'yxatga olish</h3>
  @defer (on interaction) {
    <app-camera-capture (photoCaptured)="onPhotoCaptured($event)"></app-camera-capture>
  } @placeholder {
    <button class="btn btn-secondary">Kamerani ochish</button>
  }

  @if (saving()) {
    <p class="face-register-status">Saqlanmoqda...</p>
  } @else if (message(); as text) {
    <p class="face-register-status" [class.is-error]="isError()">{{ text }}</p>
  }
</div>
