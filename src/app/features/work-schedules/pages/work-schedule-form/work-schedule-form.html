<div class="form-container">
  <h2>{{ isEditMode ? 'Edit Work Schedule' : 'Create Work Schedule' }}</h2>
  
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" formControlName="name" class="form-control" />
    </div>

    <div class="form-group">
      <label for="startTime">Start Time</label>
      <input type="time" id="startTime" formControlName="startTime" class="form-control" />
    </div>

    <div class="form-group">
      <label for="endTime">End Time</label>
      <input type="time" id="endTime" formControlName="endTime" class="form-control" />
    </div>

    <div class="actions">
      <button type="submit" [disabled]="form.invalid" class="btn btn-primary">Save</button>
      <a routerLink="/work-schedules" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
