<div class="container">
  <h2>{{ isEditMode ? 'Filialni tahrirlash' : 'Yangi filial' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
    <div class="form-group">
      <label for="name">Nomi</label>
      <input id="name" type="text" formControlName="name" class="form-control" placeholder="Filial nomi" />
    </div>

    <div class="form-group">
      <label for="address">Manzil</label>
      <input id="address" type="text" formControlName="address" class="form-control" placeholder="Manzil" />
    </div>

    <div class="form-group">
      <label for="phone">Telefon</label>
      <input id="phone" type="text" formControlName="phone" class="form-control" placeholder="Telefon raqami" />
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid" class="btn btn-primary">Saqlash</button>
      <a routerLink="/branches" class="btn btn-secondary">Bekor qilish</a>
    </div>
  </form>
</div>
