<div class="form-page">
  <div class="form-card">
    <div class="form-header">
      <div class="form-header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
      </div>
      <div>
        <h2 class="form-title">{{ isEditMode ? 'Edit' : 'New' }} Advance</h2>
        <p class="form-subtitle">Avans ma'lumotlarini kiriting</p>
      </div>
    </div>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-body">
      <div class="form-group">
        <label for="employeeId" class="form-label">Employee ID <span class="required-star">*</span></label>
        <input id="employeeId" type="text" formControlName="employeeId" class="form-input" />
        <div *ngIf="form.get('employeeId')?.invalid && form.get('employeeId')?.touched" class="text-danger">
          Employee ID is required.
        </div>
      </div>

      <div class="form-group">
        <label for="amount" class="form-label">Amount <span class="required-star">*</span></label>
        <input id="amount" type="number" formControlName="amount" class="form-input" />
        <div *ngIf="form.get('amount')?.invalid && form.get('amount')?.touched" class="text-danger">
          Valid amount is required (>= 0).
        </div>
      </div>

      <div class="form-group">
        <label for="reason" class="form-label">Reason</label>
        <input id="reason" type="text" formControlName="reason" class="form-input" />
      </div>

      <div class="form-group">
        <label for="date" class="form-label">Date <span class="required-star">*</span></label>
        <input id="date" type="date" formControlName="date" class="form-input" />
        <div *ngIf="form.get('date')?.invalid && form.get('date')?.touched" class="text-danger">
          Date is required.
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-gradient-submit" [disabled]="form.invalid">Save</button>
        <button type="button" class="btn btn-secondary-cancel" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
