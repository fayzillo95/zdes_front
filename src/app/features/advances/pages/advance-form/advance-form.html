<div class="advance-form-container">
  <h2>{{ isEditMode ? 'Edit' : 'New' }} Advance</h2>
  
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="employeeId">Employee ID *</label>
      <input id="employeeId" type="text" formControlName="employeeId" class="form-control" />
      <div *ngIf="form.get('employeeId')?.invalid && form.get('employeeId')?.touched" class="text-danger">
        Employee ID is required.
      </div>
    </div>

    <div class="form-group">
      <label for="amount">Amount *</label>
      <input id="amount" type="number" formControlName="amount" class="form-control" />
      <div *ngIf="form.get('amount')?.invalid && form.get('amount')?.touched" class="text-danger">
        Valid amount is required (>= 0).
      </div>
    </div>

    <div class="form-group">
      <label for="reason">Reason</label>
      <input id="reason" type="text" formControlName="reason" class="form-control" />
    </div>

    <div class="form-group">
      <label for="date">Date *</label>
      <input id="date" type="date" formControlName="date" class="form-control" />
      <div *ngIf="form.get('date')?.invalid && form.get('date')?.touched" class="text-danger">
        Date is required.
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save</button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    </div>
  </form>
</div>
