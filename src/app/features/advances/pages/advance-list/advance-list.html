<div class="advance-list-container">
  <div class="page-header-card">
    <div class="page-header-title-box">
      <div class="header-icon-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="6" width="20" height="12" rx="2"></rect>
          <circle cx="12" cy="12" r="2"></circle>
          <path d="M6 12h.01M18 12h.01"></path>
        </svg>
      </div>
      <div>
        <h1 class="page-title">Avanslar</h1>
        <p class="page-subtitle">Xodimlar uchun avanslarni ko'rish va boshqarish</p>
      </div>
    </div>
    <a routerLink="new" class="btn-add-new">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Yangi avans</span>
    </a>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="modern-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Xodim ID</th>
            <th>Summa</th>
            <th>Sabab</th>
            <th>Sana</th>
            <th class="text-right">Amallar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let advance of advances" class="table-row" (click)="onRowClick(advance.id)">
            <td>{{ advance.id }}</td>
            <td>{{ advance.employeeId }}</td>
            <td>{{ advance.amount }}</td>
            <td class="text-muted">{{ advance.reason }}</td>
            <td class="text-muted">{{ advance.date }}</td>
            <td class="text-right">
              <div class="action-buttons" (click)="$event.stopPropagation()">
                <a [routerLink]="['edit', advance.id]" class="btn-action edit-btn" title="Tahrirlash">Tahrirlash</a>
                <button (click)="deleteAdvance(advance.id)" class="btn-action delete-btn" title="O'chirish">O'chirish</button>
              </div>
            </td>
          </tr>
          <tr *ngIf="advances.length === 0">
            <td colspan="6" class="empty-state-cell">
              <div class="empty-state-box">
                <span class="empty-icon">📁</span>
                <p class="empty-text">Hozircha hech qanday avans topilmadi</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
