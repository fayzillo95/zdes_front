<div class="form-page">
  <div class="form-card">
    <div class="form-header">
      <div class="form-header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <div>
        <h2 class="form-title">{{ isEditMode ? 'Edit' : 'Add New' }} Holiday</h2>
        <p class="form-subtitle">Bayram ma'lumotlarini kiriting</p>
      </div>
    </div>

    <div *ngIf="isLoading" class="loading-state" style="padding: 2rem; text-align: center;">
      Loading...
    </div>

    <form *ngIf="!isLoading" [formGroup]="holidayForm" (ngSubmit)="onSubmit()" class="form-body">
      <div class="form-group">
        <label for="name" class="form-label">Holiday Name</label>
        <input 
          id="name" 
          type="text" 
          formControlName="name" 
          class="form-input"
          placeholder="e.g. New Year"
        />
        <div *ngIf="holidayForm.get('name')?.invalid && holidayForm.get('name')?.touched" class="error-msg">
          Name is required
        </div>
      </div>

      <div class="form-group">
        <label for="date" class="form-label">Date</label>
        <input 
          id="date" 
          type="date" 
          formControlName="date" 
          class="form-input"
        />
        <div *ngIf="holidayForm.get('date')?.invalid && holidayForm.get('date')?.touched" class="error-msg">
          Date is required
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-gradient-submit" [disabled]="holidayForm.invalid">
          {{ isEditMode ? 'Update' : 'Save' }} Holiday
        </button>
        <a routerLink="/holidays" class="btn btn-secondary-cancel">Back to List</a>
      </div>
    </form>
  </div>
</div>
