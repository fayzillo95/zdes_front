<div class="holiday-list-container">
  <div class="page-header-card">
    <div class="page-header-title-box">
      <div class="header-icon-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <div>
        <h1 class="page-title">Bayramlar</h1>
        <p class="page-subtitle">Rasmiy bayram va dam olish kunlari kalendarini boshqarish</p>
      </div>
    </div>
    <a routerLink="new" class="btn-add-new">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Yangi bayram</span>
    </a>
  </div>

  <div class="table-card">
    <div class="loading-state" *ngIf="loading">
      <app-skeleton-loader [rows]="5" [columns]="4"></app-skeleton-loader>
    </div>
    <div class="table-responsive" *ngIf="!loading && holidays.length > 0">
      <table class="modern-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nomi</th>
            <th>Sana</th>
            <th>Amallar</th>
          </tr>
          <tr class="column-filter-row">
            <th></th>
            <th><input type="text" class="column-filter-input" placeholder="Qidirish..." [ngModel]="nameFilter()" (ngModelChange)="nameFilter.set($event)" (click)="$event.stopPropagation()" /></th>
            <th><input type="date" class="column-filter-input" [ngModel]="startDateFilter()" (ngModelChange)="startDateFilter.set($event)" (click)="$event.stopPropagation()" /></th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let holiday of filteredHolidays()" class="table-row" (click)="onRowClick(holiday.id)">
            <td>{{ holiday.id }}</td>
            <td>{{ holiday.name }}</td>
            <td class="text-muted">{{ holiday.startDate | date }}</td>
            <td class="actions-cell" (click)="$event.stopPropagation()">
              <button (click)="deleteHoliday(holiday.id)" class="btn-action btn-delete" title="O'chirish">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                  <path d="M10 11v6M14 11v6"></path>
                </svg>
              </button>
            </td>
          </tr>
          <tr *ngIf="filteredHolidays().length === 0">
            <td colspan="4" class="empty-state-cell">
              <div class="empty-state-box">
                <span class="empty-icon">🔍</span>
                <p class="empty-text">Filterga mos bayram topilmadi</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="error-state-box" *ngIf="!loading && loadError">
      <span class="error-icon">⚠️</span>
      <p class="error-text">Ma'lumotlarni yuklashda xatolik yuz berdi.</p>
      <button class="btn-retry" (click)="loadHolidays()">Qayta urinib ko'rish</button>
    </div>
    <div class="empty-state-box" *ngIf="!loading && !loadError && holidays.length === 0">
      <span class="empty-icon">📁</span>
      <p class="empty-text">Hozircha hech qanday bayram topilmadi</p>
    </div>
  </div>
</div>
