<div class="terminal-list-container">
  <div class="page-header-card">
    <div class="page-header-title-box">
      <div class="header-icon-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </div>
      <div>
        <h1 class="page-title">Terminallar</h1>
        <p class="page-subtitle">Davomat terminallarini ko'rish va boshqarish</p>
      </div>
    </div>
    <a routerLink="new" class="btn-add-new">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Yangi terminal</span>
    </a>
  </div>

  <div class="table-card">
    <div class="loading-state" *ngIf="loading">
      <app-skeleton-loader [rows]="5" [columns]="5"></app-skeleton-loader>
    </div>
    <div class="table-responsive" *ngIf="!loading && terminals.length > 0">
      <table class="modern-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nomi</th>
            <th>Filial ID</th>
            <th>IP manzil</th>
            <th class="text-right">Amallar</th>
          </tr>
          <tr class="column-filter-row">
            <th></th>
            <th>
              <input type="text" class="column-filter-input" placeholder="Qidirish..."
                     [ngModel]="nameFilter()" (ngModelChange)="nameFilter.set($event)" (click)="$event.stopPropagation()" />
            </th>
            <th>
              <input type="text" class="column-filter-input" placeholder="Qidirish..."
                     [ngModel]="branchIdFilter()" (ngModelChange)="branchIdFilter.set($event)" (click)="$event.stopPropagation()" />
            </th>
            <th>
              <input type="text" class="column-filter-input" placeholder="Qidirish..."
                     [ngModel]="ipFilter()" (ngModelChange)="ipFilter.set($event)" (click)="$event.stopPropagation()" />
            </th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let terminal of filteredTerminals()" class="table-row" (click)="onRowClick(terminal.id)">
            <td>{{ terminal.id }}</td>
            <td>{{ terminal.name }}</td>
            <td class="text-muted">{{ terminal.branchId }}</td>
            <td class="text-muted">{{ terminal.ipAddress }}</td>
            <td class="actions-cell" (click)="$event.stopPropagation()">
              <button (click)="deleteTerminal(terminal.id)" class="btn-action btn-delete" title="O'chirish">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                  <path d="M10 11v6M14 11v6"></path>
                </svg>
              </button>
            </td>
          </tr>
          <tr *ngIf="filteredTerminals().length === 0">
            <td colspan="5" class="empty-state-cell">
              <div class="empty-state-box">
                <span class="empty-icon">🔍</span>
                <p class="empty-text">Filterga mos terminal topilmadi</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="empty-state-box" *ngIf="!loading && terminals.length === 0">
      <span class="empty-icon">📁</span>
      <p class="empty-text">Hozircha hech qanday terminal topilmadi</p>
    </div>
  </div>
</div>
