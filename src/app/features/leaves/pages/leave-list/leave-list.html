<div class="leave-list-container">
  <h2>Leaves</h2>
  <button class="btn btn-primary" routerLink="new">Create New</button>
  
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Employee ID</th>
        <th>Type</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let leave of leaves">
        <td>{{ leave.id }}</td>
        <td>{{ leave.employeeId }}</td>
        <td>{{ leave.type }}</td>
        <td>{{ leave.startDate }}</td>
        <td>{{ leave.endDate }}</td>
        <td>{{ leave.status }}</td>
        <td>
          <button class="btn btn-sm btn-info" [routerLink]="[leave.id]">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteLeave(leave.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
