<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="12" fill="url(#logo-gradient)"/>
          <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="logo-gradient" x1="0" y1="0" x2="40" y2="40">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to your account to continue</p>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      @if (errorMessage()) {
        <div class="alert alert-error" role="alert">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 5v3M8 11h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="6" r="3.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2 15.5c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input
            id="username"
            type="text"
            class="form-input"
            [class.is-invalid]="username.invalid && username.touched"
            formControlName="username"
            placeholder="Enter your username"
            autocomplete="username"
          />
        </div>
        @if (username.invalid && username.touched) {
          <span class="form-error">Username is required</span>
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="3" y="8" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M6 8V6a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input
            id="password"
            type="password"
            class="form-input"
            [class.is-invalid]="password.invalid && password.touched"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
        </div>
        @if (password.invalid && password.touched) {
          <span class="form-error">Password is required</span>
        }
      </div>

      <button
        id="login-submit-btn"
        type="submit"
        class="btn-submit"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          <span class="spinner"></span>
          <span>Signing in...</span>
        } @else {
          <span>Sign in</span>
        }
      </button>

    </form>
  </div>
</div>
