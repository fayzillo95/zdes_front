<div class="container">
  <div class="header">
    <h2>Lavozimlar</h2>
    <a routerLink="/positions/new" class="btn btn-primary">Yangi lavozim</a>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Nomi</th>
        <th>Amallar</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let position of positions">
        <td>{{ position.name }}</td>
        <td>
          <a [routerLink]="['/positions', position.id, 'edit']" class="btn btn-sm btn-info">Tahrirlash</a>
          <button (click)="deletePosition(position.id)" class="btn btn-sm btn-danger">O'chirish</button>
        </td>
      </tr>
      <tr *ngIf="positions.length === 0">
        <td colspan="2" class="text-center">Ma'lumot topilmadi</td>
      </tr>
    </tbody>
  </table>
</div>
