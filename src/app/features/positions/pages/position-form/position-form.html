<div class="container">
  <h2>{{ isEditMode ? 'Lavozimni tahrirlash' : 'Yangi lavozim' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
    <div class="form-group">
      <label for="name">Nomi</label>
      <input id="name" type="text" formControlName="name" class="form-control" placeholder="Lavozim nomi" />
    </div>

    <div class="form-group">
      <label for="departmentId">Bo'lim ID (Ixtiyoriy)</label>
      <input id="departmentId" type="text" formControlName="departmentId" class="form-control" placeholder="Bo'lim ID" />
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid" class="btn btn-primary">Saqlash</button>
      <a routerLink="/positions" class="btn btn-secondary">Bekor qilish</a>
    </div>
  </form>
</div>
