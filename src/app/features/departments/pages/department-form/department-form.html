<div class="container">
  <h2>{{ isEditMode ? 'Bo\'limni tahrirlash' : 'Yangi bo\'lim' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
    <div class="form-group">
      <label for="name">Nomi</label>
      <input id="name" type="text" formControlName="name" class="form-control" placeholder="Bo'lim nomi" />
    </div>

    <div class="form-group">
      <label for="branchId">Filial ID (Ixtiyoriy)</label>
      <input id="branchId" type="text" formControlName="branchId" class="form-control" placeholder="Filial ID" />
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid" class="btn btn-primary">Saqlash</button>
      <a routerLink="/departments" class="btn btn-secondary">Bekor qilish</a>
    </div>
  </form>
</div>
