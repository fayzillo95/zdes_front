<div class="form-page">
  <div class="form-card">
    <div class="form-header">
      <div class="form-header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"></path>
        </svg>
      </div>
      <div>
        <h2 class="form-title">{{ isEditMode ? "Kompaniyani Tahrirlash" : "Yangi Kompaniya Qo'shish" }}</h2>
        <p class="form-subtitle">Tashkilot rekvizitlari va aloqa ma'lumotlarini kiriting</p>
      </div>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        <span>⚠️ {{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-body">
      <div class="form-grid">
        <div class="form-group">
          <label for="name" class="form-label">Kompaniya Nomi <span class="required-star">*</span></label>
          <input id="name" type="text" formControlName="name" class="form-input" placeholder="Masalan: ZDES LLC" />
        </div>

        <div class="form-group">
          <label for="legalName" class="form-label">Yuridik Nomi (Legal Name)</label>
          <input id="legalName" type="text" formControlName="legalName" class="form-input" placeholder="Masalan: ZDES MCHJ" />
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Telefon Raqami</label>
          <input id="phone" type="text" formControlName="phone" class="form-input" placeholder="+998901234567" />
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Pochta</label>
          <input id="email" type="email" formControlName="email" class="form-input" placeholder="info@zdes.uz" />
        </div>

        <div class="form-group col-span-2">
          <label for="address" class="form-label">Manzil (Address)</label>
          <input id="address" type="text" formControlName="address" class="form-input" placeholder="Toshkent sh., Yunusobod tumani" />
        </div>

        <div class="form-group col-span-2">
          <label for="logoUrl" class="form-label">Logotip URL (Logo URL)</label>
          <input id="logoUrl" type="text" formControlName="logoUrl" class="form-input" placeholder="https://cdn.example.com/logo.png" />
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="form.invalid" class="btn btn-gradient-submit">
          💾 Saqlash
        </button>
        <a routerLink="/companies" class="btn btn-secondary-cancel">
          Bekor qilish
        </a>
      </div>
    </form>
  </div>
</div>
