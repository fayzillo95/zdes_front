<div class="filter-header-bar">
  <div class="filter-header-title">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
    </svg>
    <span>Filtrlash va Sozlamalar:</span>
  </div>

  <div class="filter-controls">
    <!-- Company Filter (SuperAdmin only) -->
    @if (currentUser()?.role === 'superadmin') {
      <div class="filter-group">
        <select [ngModel]="selectedCompanyId" (ngModelChange)="onCompanyChange($event)" class="filter-select" title="Kompaniya bo'yicha filter">
          <option value="">-- Barcha Kompaniyalar --</option>
          @for (c of companies() || []; track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
      </div>
    }

    <!-- Branch Filter -->
    <div class="filter-group">
      <select [ngModel]="selectedBranchId" (ngModelChange)="onBranchChange($event)" class="filter-select" title="Filial bo'yicha filter">
        <option value="">-- Barcha Filiallar --</option>
        @for (b of branches() || []; track b.id) {
          <option [value]="b.id">{{ b.name }}</option>
        }
      </select>
    </div>

    <!-- Department Filter -->
    <div class="filter-group">
      <select [ngModel]="selectedDepartmentId" (ngModelChange)="onDepartmentChange($event)" class="filter-select" title="Bo'lim bo'yicha filter">
        <option value="">-- Barcha Bo'limlar --</option>
        @for (d of departments() || []; track d.id) {
          <option [value]="d.id">{{ d.name }}</option>
        }
      </select>
    </div>

    <!-- Global Search input -->
    <div class="filter-search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" [ngModel]="searchQuery" (ngModelChange)="onSearchInput($event)" placeholder="Qidiruv..." class="filter-search-input" />
    </div>

    <!-- Reset button -->
    @if (selectedCompanyId || selectedBranchId || selectedDepartmentId || searchQuery) {
      <button class="btn-reset-filter" (click)="resetAllFilters()" title="Filtrlarni tozash">
        ✕ Tozalash
      </button>
    }
  </div>
</div>
